[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uev"
version = "0.3.0"
description = "Open-source e-mobility energy and investment modelling prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
demo = ["streamlit>=1.35"]
geo = ["fastapi>=0.115", "uvicorn>=0.30", "numpy>=1.26", "scipy>=1.13"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
