[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uev"
version = "0.1.0"
description = "Open-source e-mobility energy and investment modelling prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
demo = ["streamlit>=1.35"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
